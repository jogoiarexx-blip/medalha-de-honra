name: QA campanha e estabilidade
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "assets/**"
      - "qa/**"
      - ".github/workflows/qa-campanha.yml"
  pull_request:
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "assets/**"
      - "qa/**"
  workflow_dispatch:
jobs:
  estrutural:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sintaxe de todos os scripts do jogo
        run: |
          for f in js/*.js; do node --check "$f"; done
      - name: Entradas e tarefas por sessão (regressões isoladas)
        run: node --test qa/test_input_session.cjs qa/test_request_failure.cjs qa/test_combat.cjs
      - name: Testes estruturais
        run: |
          node qa/test_three_local.js
          node qa/test_menu_principal.js
          node qa/test_material_paris.js
          node qa/test_fase9_lancha_refinada2.js
          node qa/test_pastor_visibilidade.js
          node qa/test_glb_assets.cjs
  navegador:
    name: navegador (${{ matrix.grupo }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        grupo: [estado, recursos, campanha]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar Chromium (Playwright)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Estados, combate e saves
        if: matrix.grupo == 'estado'
        run: |
          node qa/test_cp02_browser.cjs
          node qa/test_cp01_browser.cjs
          node qa/test_registry_27.cjs
          node qa/test_save_migration.cjs
          node qa/test_frame_pacing.cjs
          node qa/test_state_transitions.cjs
      - name: Recursos, perfis, áudio e IA
        if: matrix.grupo == 'recursos'
        run: |
          node qa/test_reloads_memory.cjs
          node qa/test_hardware_profiles.cjs
          node qa/test_audio_states.cjs
          node qa/test_ai_budget.cjs
          node qa/browser_pastor_diagnostico.cjs
      - name: Campanha e desempenho
        if: matrix.grupo == 'campanha'
        run: |
          node qa/test_operation_progress.cjs
          node qa/test_performance_scene.cjs
        env:
          QA_PERF_SECONDS: "10"
      - name: Guardar relatórios e capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-campanha-${{ matrix.grupo }}
          path: |
            qa-report/
            qa-shots/
          if-no-files-found: warn
