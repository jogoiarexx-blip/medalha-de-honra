name: QA pastor-alemao
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "js/18-menu-system.js"
      - "js/24a-dog-meshy.js"
      - "js/24-secret-operations.js"
      - "assets/models/pastor-alemao-animado.glb"
      - "qa/test_pastor_visibilidade.js"
      - "qa/test_pastor_scale_fur.cjs"
      - "qa/lib/pastor-fixture.cjs"
      - "qa/browser_pastor_diagnostico.cjs"
      - ".github/workflows/qa-pastor.yml"
  pull_request:
    paths:
      - "index.html"
      - "js/18-menu-system.js"
      - "js/24a-dog-meshy.js"
      - "js/24-secret-operations.js"
      - "assets/models/pastor-alemao-animado.glb"
      - "qa/test_pastor_visibilidade.js"
      - "qa/test_pastor_scale_fur.cjs"
      - "qa/lib/pastor-fixture.cjs"
      - "qa/browser_pastor_diagnostico.cjs"
jobs:
  structural-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar sintaxe JavaScript
        run: |
          node --check js/18-menu-system.js
          node --check js/24a-dog-meshy.js
          node --check js/24-secret-operations.js
      - name: Testar estrutura do cachorro e suas animacoes
        run: |
          node qa/test_pastor_visibilidade.js
          node --test qa/test_pastor_scale_fur.cjs

  webgl-pastor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Conferir pastor no menu, animações e variantes
        run: node qa/browser_pastor_diagnostico.cjs
      - name: Guardar capturas do pastor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-pastor-webgl
          path: qa-shots/
